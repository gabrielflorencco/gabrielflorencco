<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100" viewBox="0 0 400 100" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="100" spreadMethod="pad">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>
  <rect width="400" height="100" fill="url(#grad)"/>
  <!-- Decorative left line -->
  <line x1="0" y1="0" x2="0" y2="100" stroke="#dee2e6" stroke-width="3"/>
  <!-- Name text -->
  <text x="200" y="70" text-anchor="middle" font-family="SF Pro Display, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="52" font-weight="700" fill="#1a1a1e">Gabriel Florenço</text>
</svg>